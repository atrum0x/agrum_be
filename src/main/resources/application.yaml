spring:
  application:
    name: agrum

  datasource:
      url: ${DB_URL:jdbc:postgresql://localhost:5432/agrum}
      username: ${DB_USERNAME:postgres}
      password: ${DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Use 'update' for development so it builds the tables for you.
      # Switch to 'validate' in production using Flyway or Liquibase.
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
        # 1. How long to wait to establish a connection (Fail fast!)
      connect-timeout: 2s
      # 2. How long to wait for a command to finish before throwing an error
      timeout: 2s

      # (Optional) Control the Lettuce client's internal behavior
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

jwt:
  secret: ${JWT_SECRET} # Must be at least 256 bits for HMAC-SHA
  expiration: ${JWT_EXP}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}